---

##### CI for use by github no need for action to be added
##### Inherited
ci:
  autofix_prs: false
  skip: [ansible-lint]

# Hook repos may pin a language_version newer than the interpreter available here
# (ansible-lint v26.3.0 asks for python3.14). Pin to the venv's Python so hook
# environments build against the same interpreter ansible-core is installed under.
default_language_version:
  python: python3.12

repos:
- repo: https://github.com/pre-commit/pre-commit-hooks
  rev: v6.0.0
  hooks:
  # Safety
  - id: detect-aws-credentials
    name: Detect AWS Credentials
    # Without this the hook exits 2 on any machine that has no ~/.aws/credentials
    # to compare against, which is a tooling error rather than a finding.
    args: [--allow-missing-credentials]
  - id: detect-private-key
    name: Detect Private Keys

  # git checks
  - id: check-merge-conflict
    name: Check for merge conflicts
  - id: check-added-large-files
    name: Check for Large files
  - id: check-case-conflict
    name: Check case conflict

  # General checks
  - id: trailing-whitespace
    name: Trim Trailing Whitespace
    description: This hook trims trailing whitespace.
    entry: trailing-whitespace-fixer
    language: python
    types: [text]
    args: [--markdown-linebreak-ext=md]
  - id: end-of-file-fixer
    name: Ensure line at end of file

# Scan for passwords
- repo: https://github.com/Yelp/detect-secrets
  rev: v1.5.0
  hooks:
  - id: detect-secrets
    name: Detect Secrets test

- repo: https://github.com/gitleaks/gitleaks
  rev: v8.30.1
  hooks:
  - id: gitleaks
    name: Run Gitleaks test

- repo: https://github.com/ansible-community/ansible-lint
  rev: v26.3.0
  hooks:
  - id: ansible-lint
    name: Ansible-lint
    description: This hook runs ansible-lint.
    # This collection has no site.yml. rotate.yml is only the entry point, so lint
    # the whole repo to cover roles/ssh_key_rotation too.
    entry: python3 -m ansiblelint --force-color -c .ansible-lint
    language: python
    language_version: python3.12
    # do not pass files to ansible-lint, see:
    # https://github.com/ansible/ansible-lint/issues/611
    pass_filenames: false
    always_run: true

- repo: https://github.com/adrienverge/yamllint.git
  rev: v1.38.0  # or higher tag
  hooks:
  - id: yamllint
    name: Check YAML Lint
