---

- name: Verify | Close any connection left open from the install stage before testing the new key
  ansible.builtin.meta: reset_connection

- name: Verify | New KEY | Gather facts
  ansible.builtin.setup:

# Hard safety gate: if the new key can't authenticate, this fails the host and nothing below (the destructive part) executes.
- name: Verify | New KEY | Confirm the host is reachable
  ansible.builtin.ping:
  register: ssh_key_rotation_new_key_ping

- name: Verify | New KEY | Assert the key authenticated before any deletion
  ansible.builtin.assert:
    that: ssh_key_rotation_new_key_ping is succeeded
    fail_msg: "New key did not authenticate - aborting before removing the old key."
    success_msg: "New (PwC) key verified. Proceeding to remove the old key."

# Everything below removes access (the old key, then optionally password/keyboard-interactive auth), so
# if any of it fails partway through, the rescue: section below automatically restores authorized_keys
# and sshd_config from the backups taken here and fails loudly - rather than leaving the host half-changed.
- name: Verify | New KEY | Rotate access, with automatic rollback if anything below fails
  block:
    - name: Verify | New KEY | Back up authorized_keys before removing the old key
      ansible.builtin.copy:
        src: "~{{ ssh_key_rotation_target_user }}/.ssh/authorized_keys"
        dest: "~{{ ssh_key_rotation_target_user }}/.ssh/authorized_keys.bak-{{ ansible_date_time.iso8601_basic_short }}"
        remote_src: true
        mode: preserve
      register: ssh_key_rotation_authorized_keys_backup

    - name: Verify | New KEY | Remove the OLD public key from authorized_keys
      ansible.posix.authorized_key:
        user: "{{ ssh_key_rotation_target_user }}"
        key: "{{ lookup('file', old_public_key_file) }}"
        state: absent

    - name: Verify | (Optional) Make authorized_keys exclusive to the PwC key
      when: ssh_key_rotation_make_exclusive
      ansible.posix.authorized_key:
        user: "{{ ssh_key_rotation_target_user }}"
        key: "{{ lookup('file', new_public_key_file) }}"
        state: present
        exclusive: true

    # Explicit, deterministically-named backup (same pattern as authorized_keys above), so rescue: below
    # knows exactly which file to restore, rather than chasing lineinfile's own auto-named backup files.
    - name: Verify | Back up sshd_config before disabling legacy auth
      when: ssh_key_rotation_disable_password_auth or ssh_key_rotation_disable_kbd_interactive
      ansible.builtin.copy:
        src: /etc/ssh/sshd_config
        dest: "/etc/ssh/sshd_config.bak-{{ ansible_date_time.iso8601_basic_short }}"
        remote_src: true
        mode: preserve
      become: true
      register: ssh_key_rotation_sshd_config_backup

    - name: Verify | Disable password authentication (the old way of connecting)
      when: ssh_key_rotation_disable_password_auth
      ansible.builtin.lineinfile:
        path: /etc/ssh/sshd_config
        regexp: '^#?\s*PasswordAuthentication'
        line: 'PasswordAuthentication no'
        validate: 'sshd -t -f %s'
        backup: true
      become: true
      notify: Reload sshd

    - name: Verify | Disable keyboard-interactive authentication
      when: ssh_key_rotation_disable_kbd_interactive
      ansible.builtin.lineinfile:
        path: /etc/ssh/sshd_config
        regexp: '^#?\s*KbdInteractiveAuthentication'
        line: 'KbdInteractiveAuthentication no'
        validate: 'sshd -t -f %s'
        backup: true
      become: true
      notify: Reload sshd

    - name: Verify | Apply final sshd changes
      ansible.builtin.meta: flush_handlers

    - name: Verify | Final connectivity check with the NEW key after lock-down
      ansible.builtin.ping:

  rescue:
    # Guarded with `is succeeded`, not just `is defined`: if the very first task above (the backup itself)
    # is what failed, nothing has actually changed yet, so there's nothing to restore.
    - name: Rollback | Restore authorized_keys from the pre-cleanup backup
      when: ssh_key_rotation_authorized_keys_backup is succeeded
      ansible.builtin.copy:
        src: "{{ ssh_key_rotation_authorized_keys_backup.dest }}"
        dest: "~{{ ssh_key_rotation_target_user }}/.ssh/authorized_keys"
        remote_src: true
        mode: preserve

    - name: Rollback | Restore sshd_config from the pre-cleanup backup
      when: ssh_key_rotation_sshd_config_backup is defined and ssh_key_rotation_sshd_config_backup is succeeded
      ansible.builtin.copy:
        src: "{{ ssh_key_rotation_sshd_config_backup.dest }}"
        dest: /etc/ssh/sshd_config
        remote_src: true
        mode: preserve
      become: true

    # A failed reload must not abort the rollback. authorized_keys and sshd_config are already
    # restored on disk above, and sshd reads authorized_keys per-connection, so access is back even
    # if the daemon never re-read its config. rescue: has no rescue of its own, so letting this fail
    # would skip the two tasks that matter most here: the connectivity check below (the real access
    # gate) and the diagnostic that tells the operator what was restored. Reported in that message
    # instead. Note the reload can fail for the very same reason the block did - both use
    # ssh_key_rotation_sshd_service - so this is the expected path, not an edge case.
    - name: Rollback | Reload sshd with the restored configuration
      when: ssh_key_rotation_sshd_config_backup is defined and ssh_key_rotation_sshd_config_backup is succeeded
      ansible.builtin.service:
        name: "{{ ssh_key_rotation_sshd_service }}"
        state: reloaded
      become: true
      register: ssh_key_rotation_rollback_reload
      ignore_errors: true

    # Stays fatal on purpose: this is what proves access survived the rollback.
    - name: Rollback | Confirm connectivity still works after rollback
      ansible.builtin.ping:

    - name: Rollback | Fail with details of what was automatically restored
      ansible.builtin.fail:
        msg: >-
          Verify stage failed partway through cleanup and was automatically rolled back.
          Original error: {{ ansible_failed_result.msg | default(ansible_failed_result) }}.
          Restored authorized_keys from
          {{ ssh_key_rotation_authorized_keys_backup.dest | default('n/a - nothing had changed yet') }}
          {{ ('and sshd_config from ' + ssh_key_rotation_sshd_config_backup.dest)
             if (ssh_key_rotation_sshd_config_backup is defined and ssh_key_rotation_sshd_config_backup is succeeded)
             else '(sshd_config was not touched)' }}.
          The old key and prior sshd_config are back in place; nothing was left half-changed.
          {{ ('WARNING: sshd could not be reloaded during the rollback ('
              ~ (ssh_key_rotation_rollback_reload.msg | default('unknown error'))
              ~ ') - the restored sshd_config is on disk but is NOT yet active. Reload or restart'
              ~ ' sshd manually to activate it. Key-based access is unaffected, since sshd reads'
              ~ ' authorized_keys per connection.')
             if (ssh_key_rotation_rollback_reload is defined and ssh_key_rotation_rollback_reload is failed)
             else '' }}
