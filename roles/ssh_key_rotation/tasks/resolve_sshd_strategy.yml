---

# Decides HOW this host's sshd will be configured, and is included by both install.yml and
# verify.yml so the two stages can never disagree.
#
# Included by verify as well as install rather than relying on install's facts carrying over: they
# do persist between plays of one run, but the verify stage can be run standalone via tasks_from,
# and --limit can exclude a host from the install play. Recomputing costs one grep and removes a
# whole class of "undefined variable" failure - which, inside a rescue:, aborts the rescue and
# leaves a half-changed host with no rollback at all.
#
# Sets:
#   ssh_key_rotation_use_dropin                   - true when sshd reads /etc/ssh/sshd_config.d/
#   ssh_key_rotation_sshd_dropin_effective_prefix - numeric prefix the drop-ins are written with

- name: Resolve sshd strategy | Find sshd_config's Include and Match directives
  ansible.builtin.include_tasks: resolve_sshd_anchor.yml

# An `Include` line means OpenSSH 8.2 or newer, which is every currently supported distribution.
# Where it exists the role configures itself entirely through drop-ins and never edits the
# administrator's sshd_config, so undoing a run is deleting a file rather than restoring theirs.
- name: Resolve sshd strategy | Decide between drop-ins and editing sshd_config
  ansible.builtin.set_fact:
    ssh_key_rotation_use_dropin: "{{ ssh_key_rotation_sshd_anchors.stdout is search('(?im)^\\d+:\\s*Include\\s') }}"
    ssh_key_rotation_sshd_dropin_effective_prefix: >-
      {{ '01' if (ssh_key_rotation_manage_sshd_dropin | bool) else ssh_key_rotation_sshd_dropin_prefix }}

- name: Resolve sshd strategy | Warn when this host is too old for drop-ins
  when: not (ssh_key_rotation_use_dropin | bool)
  ansible.builtin.debug:
    msg: >-
      /etc/ssh/sshd_config on this host has no `Include` line, so this OpenSSH predates 8.2 and
      cannot read /etc/ssh/sshd_config.d/. Falling back to a marked block inside sshd_config, which
      is backed up first. Rolling that back restores a file rather than deleting one.
