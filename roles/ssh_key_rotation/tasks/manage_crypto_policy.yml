---

# Applying half of the crypto-policy handling. crypto_policy_plan.yml must have run first on the same
# host: it works out the desired policy and stops on anything unsafe. Shared by validate.yml (control
# node) and install.yml (target host).
#
# Callers must pass:
#   ssh_key_rotation_crypto_policy_context           - noun phrase for task names
# Callers may pass:
#   ssh_key_rotation_crypto_policy_notify_reload     - notify the "Reload sshd" handler once applied (default true;
#                                                       validate.yml sets this false, there's no target sshd to reload on the control node)
#   ssh_key_rotation_crypto_policy_record_state      - record the change in the host's rotation state so a rollback
#                                                       can undo it (default false; only install.yml, on the target, sets it)

# Recorded BEFORE the change. The install stage clears this record when it starts, so it only ever
# describes a change made by the current run - never a policy an earlier, successful run set on purpose.
- name: "Manage crypto policy | Record the policy change about to be made on {{ ssh_key_rotation_crypto_policy_context }}"
  when:
    - ssh_key_rotation_crypto_policy_record_state | default(false) | bool
    - ssh_key_rotation_crypto_policy_change | bool
  ansible.builtin.include_tasks: state_write.yml
  vars:
    ssh_key_rotation_state:
      crypto_policy:
        before: "{{ ssh_key_rotation_crypto_policy_current.stdout | trim }}"
        applied: "{{ ssh_key_rotation_crypto_policy_desired }}"

# update-crypto-policies restarts sshd by itself, so the new policy is live for the next connection
# whether or not the handler below ever fires. That is why the safety checks live in the plan.
- name: "Manage crypto policy | Apply the desired crypto policy on {{ ssh_key_rotation_crypto_policy_context }}"
  when: ssh_key_rotation_crypto_policy_change | bool
  ansible.builtin.command: "update-crypto-policies --set {{ ssh_key_rotation_crypto_policy_desired }}"
  become: true
  changed_when: true
  notify: "{{ 'Reload sshd' if (ssh_key_rotation_crypto_policy_notify_reload | default(true)) else omit }}"
