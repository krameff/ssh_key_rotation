---
driver:
  name: docker
platforms:
  - name: ssh-key-rotation-ubuntu2204
    image: geerlingguy/docker-ubuntu2204-ansible:latest
    command: /usr/sbin/init
    privileged: true
    cgroupns_mode: host
    pre_build_image: false
    groups:
      - rotate
  - name: ssh-key-rotation-rockylinux9
    image: geerlingguy/docker-rockylinux9-ansible:latest
    command: /usr/sbin/init
    privileged: true
    cgroupns_mode: host
    pre_build_image: false
    groups:
      - rotate
  - name: ssh-key-rotation-rockylinux10
    image: geerlingguy/docker-rockylinux10-ansible:latest
    command: /usr/sbin/init
    privileged: true
    cgroupns_mode: host
    pre_build_image: false
    groups:
      - rotate
provisioner:
  name: ansible
  env:
    ANSIBLE_ROLES_PATH: "../../../roles"
    # The docker connection plugin doesn't invoke a login shell, so `~` in the default
    # remote_tmp path doesn't reliably expand. Pin it to an absolute path instead.
    ANSIBLE_REMOTE_TMP: /tmp/.ansible-remote-tmp
scenario:
  test_sequence:
    - dependency
    - syntax
    - create
    - prepare
    - converge
    - verify
    - destroy
verifier:
  name: ansible
