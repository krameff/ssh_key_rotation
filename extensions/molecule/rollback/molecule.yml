---

driver:
  name: docker
platforms:
  # The first platform carries the settings every platform shares; the rest merge it and
  # override only name/image. The Dockerfile itself is shared across scenarios too, hence the
  # relative path (the docker driver resolves `dockerfile` against this scenario directory).
  - &platform_defaults
    name: ssh-key-rotation-rollback-ubuntu2204
    image: geerlingguy/docker-ubuntu2204-ansible:latest
    dockerfile: ../resources/Dockerfile.j2
    command: /usr/sbin/init
    privileged: true
    cgroupns_mode: host
    pre_build_image: false
    tmpfs:
      - /run
      - /run/lock
    volumes:
      - /sys/fs/cgroup:/sys/fs/cgroup:rw
    groups:
      - rotate
  - <<: *platform_defaults
    name: ssh-key-rotation-rollback-rockylinux9
    image: geerlingguy/docker-rockylinux9-ansible:latest
  - <<: *platform_defaults
    name: ssh-key-rotation-rollback-rockylinux10
    image: geerlingguy/docker-rockylinux10-ansible:latest
dependency:
  # Mirrors exactly what CI used to run as a separate step, so a local `molecule test` and a
  # CI run install the same collection dependencies. Molecule chdirs to the project directory
  # (the collection root) before running a sequence, so this relative path is correct.
  name: shell
  command: ansible-galaxy install -r requirements.yml
provisioner:
  name: ansible
  env:
    # converge.yml includes the role by its bare name, so this has to be right. Two traps:
    # the collection's own ansible.cfg (roles_path = ./roles) is NOT consulted, because
    # Molecule generates its own ansible.cfg and points ANSIBLE_CONFIG at it; and Molecule
    # runs with the project directory as cwd, not the scenario directory, so a
    # scenario-relative path like ../../../roles resolves outside the repo entirely.
    # MOLECULE_PROJECT_DIRECTORY is the collection root, and the `.` fallback is the same
    # thing whenever it isn't exported, since Molecule chdirs there before running a sequence.
    ANSIBLE_ROLES_PATH: "${MOLECULE_PROJECT_DIRECTORY:-.}/roles"
  inventory:
    group_vars:
      # The docker connection plugin doesn't invoke a login shell, so `~` in the default
      # remote_tmp path doesn't reliably expand for the "rotate" containers. Pin it to the
      # absolute path resources/Dockerfile.j2 already creates for root in the image. Scoped to
      # this group only - localhost (used by molecule's own internal playbooks and the
      # key-generation play) must keep its normal, non-root remote_tmp.
      rotate:
        ansible_remote_tmp: /root/.ansible/tmp
        # These containers are entered as root. Saying so explicitly means Ansible skips
        # become for the role's `become: true` tasks (become_user root == remote_user root)
        # instead of shelling out to sudo. Without this, sudo runs and fails on images whose
        # pam/shadow setup can't serve an account lookup inside a container (seen on
        # rockylinux9: "PAM account management error: Authentication service cannot retrieve
        # authentication info"), which has nothing to do with what these tests are proving.
        ansible_user: root
scenario:
  test_sequence:
    - dependency
    # Leading destroy: without it a container left behind by an aborted run is reused, and its
    # authorized_keys already holds keys from that run. That silently breaks this suite's core
    # premise (only the seeded key is authorized before converge runs).
    - destroy
    - syntax
    - create
    - prepare
    - converge
    - verify
    - destroy
verifier:
  name: ansible
