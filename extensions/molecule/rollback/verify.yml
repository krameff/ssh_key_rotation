---

# Confirms the rescue: block in roles/ssh_key_rotation/tasks/verify.yml actually restored
# access after rotation 2 was deliberately broken: key_a (the pre-failure state) must still
# work, authorized_keys must match the pre-failure checkpoint, and sshd must still be running.

- name: Verify | Confirm key_a still authenticates after the failed/rolled-back rotation
  hosts: rotate
  # Facts are needed for the family-specific sshd unit name below.
  gather_facts: true
  vars:
    ssh_key_rotation_test_dir: "{{ lookup('env', 'MOLECULE_EPHEMERAL_DIRECTORY') }}"
    # Same lookup prepare.yml uses: Debian/Ubuntu: ssh, RedHat/Rocky: sshd. Hardcoding "sshd"
    # here only worked on Ubuntu by accident, via ssh.service's sshd.service alias.
    ssh_key_rotation_sshd_service: "{{ 'sshd' if ansible_facts['os_family'] == 'RedHat' else 'ssh' }}"
    ssh_key_rotation_verify_ssh_opts: >-
      -o BatchMode=yes -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null
      -o IdentitiesOnly=yes -o ConnectTimeout=15
  tasks:
    - name: Verify | Discover this container's IP address for the real SSH check
      ansible.builtin.command: hostname -I
      changed_when: false
      register: ssh_key_rotation_verify_container_ip

    # Has to be a real ssh client: molecule's docker driver reaches this group over
    # ansible_connection=community.docker.docker, which ignores ansible_ssh_private_key_file, so an
    # ansible.builtin.ping here succeeds no matter which key is passed (it returns "pong" even for a
    # nonexistent key file) and would prove nothing about key_a still working. This is THE assertion
    # the whole rollback scenario exists to make, so it must exercise the real transport.
    - name: Verify | key_a authenticates over real SSH after the rollback
      ansible.builtin.command: >-
        ssh -i {{ ssh_key_rotation_test_dir }}/key_a {{ ssh_key_rotation_verify_ssh_opts }}
        {{ ssh_key_rotation_rollback_user }}@{{ ssh_key_rotation_verify_container_ip.stdout.split() | first }} true
      delegate_to: localhost
      changed_when: false

    - name: Verify | sshd is running
      ansible.builtin.systemd_service:
        name: "{{ ssh_key_rotation_sshd_service }}"
      become: true
      register: ssh_key_rotation_sshd_unit

    - name: Verify | Assert sshd is still active after the rolled-back rotation
      ansible.builtin.assert:
        that: ssh_key_rotation_sshd_unit.status.ActiveState == 'active'
        fail_msg: >-
          {{ ssh_key_rotation_sshd_service }} is
          {{ ssh_key_rotation_sshd_unit.status.ActiveState }}, not active, after the rollback.
        success_msg: "{{ ssh_key_rotation_sshd_service }} is still active after the rollback."

    # THE regression guard for the rescue path. The rollback restores authorized_keys with a copy
    # running as root; if that copy does not chown the file back to the rotated user, sshd's
    # StrictModes ignores it completely and refuses every key - a full lockout that still looks
    # like a clean, successful rollback in the play recap. Checked before the content assertions
    # below because restoring the right bytes with the wrong owner is still a locked-out host.
    - name: Verify | Stat authorized_keys after the rolled-back rotation
      ansible.builtin.stat:
        path: "/home/{{ ssh_key_rotation_rollback_user }}/.ssh/authorized_keys"
      register: ssh_key_rotation_rollback_ak_stat

    - name: Verify | Rollback restored authorized_keys with the rotated user's ownership intact
      ansible.builtin.assert:
        that:
          - ssh_key_rotation_rollback_ak_stat.stat.exists
          - ssh_key_rotation_rollback_ak_stat.stat.pw_name == ssh_key_rotation_rollback_user
          - not ssh_key_rotation_rollback_ak_stat.stat.wgrp
          - not ssh_key_rotation_rollback_ak_stat.stat.woth
        fail_msg: >-
          After the rollback, authorized_keys is owned by
          {{ ssh_key_rotation_rollback_ak_stat.stat.pw_name | default('(missing file)') }}
          (mode {{ ssh_key_rotation_rollback_ak_stat.stat.mode | default('n/a') }}), not
          {{ ssh_key_rotation_rollback_user }}. sshd StrictModes will ignore the file and refuse
          every key - the rescue block restored the content but locked the user out.
        success_msg: >-
          Rollback restored authorized_keys still owned by {{ ssh_key_rotation_rollback_user }};
          sshd StrictModes will honour it.

    # Backups matter too: these are what a LATER rollback would restore from, so a root-owned
    # backup is a lockout waiting to happen on the next failed rotation.
    - name: Verify | Find the backups left behind by the rotations
      ansible.builtin.find:
        paths: "/home/{{ ssh_key_rotation_rollback_user }}/.ssh"
        patterns: "authorized_keys.bak-*"
      register: ssh_key_rotation_rollback_ak_backups

    - name: Verify | Every authorized_keys backup is owned by the rotated user
      ansible.builtin.assert:
        that: >-
          ssh_key_rotation_rollback_ak_backups.files
          | rejectattr('pw_name', 'equalto', ssh_key_rotation_rollback_user) | list | length == 0
        fail_msg: >-
          These authorized_keys backups are not owned by {{ ssh_key_rotation_rollback_user }}:
          {{ ssh_key_rotation_rollback_ak_backups.files
             | rejectattr('pw_name', 'equalto', ssh_key_rotation_rollback_user)
             | map(attribute='path') | list }}. Restoring one of these in a future rollback would
          lock the user out.
        success_msg: >-
          All {{ ssh_key_rotation_rollback_ak_backups.files | length }} backup(s) are correctly owned.

    - name: Verify | Read authorized_keys after the failed rotation
      ansible.builtin.slurp:
        src: "/home/{{ ssh_key_rotation_rollback_user }}/.ssh/authorized_keys"
      register: ssh_key_rotation_post_failure_authorized_keys

    - name: Verify | Load the pre-failure checkpoint
      ansible.builtin.slurp:
        src: "{{ ssh_key_rotation_test_dir }}/checkpoint_authorized_keys.{{ inventory_hostname }}"
      delegate_to: localhost
      register: ssh_key_rotation_checkpoint_authorized_keys

    # Superset, not exact equality. The checkpoint is taken after rotation 1, i.e. BEFORE rotation
    # 2's install stage adds key_b, whereas the rescue block restores the backup taken at the start
    # of the VERIFY stage - which already contains key_b. Demanding an exact match would therefore
    # require the rescue to undo the install stage, which it does not claim to do and should not:
    # install is purely additive (it adds the new key and removes nothing), so it leaves nothing
    # unsafe behind. The property that actually matters is that no key authorized before the failed
    # rotation was lost - i.e. the known-good access is back. key_b remaining is expected and benign:
    # it is a key the operator deliberately installed and holds the private half of.
    - name: Verify | No authorized key from the pre-failure checkpoint was lost in the rollback
      vars:
        ssh_key_rotation_checkpoint_key_lines: >-
          {{ (ssh_key_rotation_checkpoint_authorized_keys.content | b64decode).splitlines()
             | map('trim') | reject('eq', '') | list }}
        ssh_key_rotation_post_failure_key_lines: >-
          {{ (ssh_key_rotation_post_failure_authorized_keys.content | b64decode).splitlines()
             | map('trim') | reject('eq', '') | list }}
      ansible.builtin.assert:
        that: >-
          ssh_key_rotation_checkpoint_key_lines
          | difference(ssh_key_rotation_post_failure_key_lines) | length == 0
        fail_msg: >-
          authorized_keys is missing key(s) that were present before the failed rotation - the
          rescue block did not restore access. Missing:
          {{ ssh_key_rotation_checkpoint_key_lines
             | difference(ssh_key_rotation_post_failure_key_lines) }}
        success_msg: >-
          Every key authorized before the failed rotation is present again after the rollback
          ({{ ssh_key_rotation_post_failure_key_lines | length }} key(s) now authorized).

    # Literal `in`, never `is search`: `search` treats its argument as a REGEX and a base64 key blob
    # routinely contains `+` (a quantifier), so the pattern fails to match a key that IS present.
    - name: Verify | key_a specifically is back in authorized_keys
      ansible.builtin.assert:
        that: >-
          lookup('file', ssh_key_rotation_test_dir + '/key_a.pub').split()[1]
          in (ssh_key_rotation_post_failure_authorized_keys.content | b64decode)
        fail_msg: >-
          key_a (the known-good key from the successful first rotation) is NOT in authorized_keys
          after the rollback - the rescue block failed to restore the pre-failure access.
        success_msg: "key_a is back in authorized_keys after the rollback."
