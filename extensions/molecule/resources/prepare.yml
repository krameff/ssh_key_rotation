---

# Shared by every Molecule scenario: each scenario's prepare.yml is a thin wrapper that
# imports this playbook and supplies the vars listed below. Prepares each Molecule-managed
# container as a realistic rotation target: ephemeral keypairs generated on the control node,
# one of them pre-authorized (simulating existing access before install.yml ever runs), and a
# generated inventory that converge.yml uses to reach the containers over actual SSH (not the
# Molecule docker connection plugin, since that's not what the role uses in production).
#
# Vars each scenario must supply:
#   ssh_key_rotation_test_keys      List of keypairs to generate, as {name, type, bits}.
#                                   `bits` is optional and only meaningful for RSA.
#   ssh_key_rotation_test_seed_key  Name of the keypair to install as pre-existing authorized
#                                   access on every container.
#
# Optional:
#   ssh_key_rotation_test_rotation_vars
#                                   {old: <key name>, new: <key name>}. When set, writes
#                                   rotation_vars.yml, the single extra-vars file used by a
#                                   converge that shells out to playbooks/rotate.yml. Scenarios
#                                   that drive the role's stages directly don't need it.

- name: Prepare | Generate ephemeral keys and the test inventory on the control node
  hosts: localhost
  connection: local
  gather_facts: false
  vars:
    ssh_key_rotation_test_dir: "{{ lookup('env', 'MOLECULE_EPHEMERAL_DIRECTORY') }}"
  tasks:
    - name: Prepare | Generate the ephemeral test keypairs
      ansible.builtin.command:
        cmd: >-
          ssh-keygen -t {{ item.type }}
          {{ ('-b ' ~ item.bits) if item.bits is defined else '' }}
          -N '' -f {{ ssh_key_rotation_test_dir }}/{{ item.name }}
        creates: "{{ ssh_key_rotation_test_dir }}/{{ item.name }}"
      loop: "{{ ssh_key_rotation_test_keys }}"
      loop_control:
        label: "{{ item.name }} ({{ item.type }})"

    - name: Prepare | Write the generated rotation vars file used by converge.yml
      when: ssh_key_rotation_test_rotation_vars | default({}) | length > 0
      vars:
        ssh_key_rotation_test_old: "{{ ssh_key_rotation_test_rotation_vars.old }}"
        ssh_key_rotation_test_new: "{{ ssh_key_rotation_test_rotation_vars.new }}"
      ansible.builtin.copy:
        dest: "{{ ssh_key_rotation_test_dir }}/rotation_vars.yml"
        mode: "0600"
        content: |
          ---
          old_private_key: "{{ ssh_key_rotation_test_dir }}/{{ ssh_key_rotation_test_old }}"
          old_public_key_file: "{{ ssh_key_rotation_test_dir }}/{{ ssh_key_rotation_test_old }}.pub"
          new_private_key: "{{ ssh_key_rotation_test_dir }}/{{ ssh_key_rotation_test_new }}"
          new_public_key_file: "{{ ssh_key_rotation_test_dir }}/{{ ssh_key_rotation_test_new }}.pub"
          ssh_key_rotation_target_user: root

- name: Prepare | Seed the pre-existing key into each container's authorized_keys
  hosts: rotate
  gather_facts: true
  vars:
    ssh_key_rotation_test_dir: "{{ lookup('env', 'MOLECULE_EPHEMERAL_DIRECTORY') }}"
    # openssh-server is installed at Dockerfile build time (see resources/Dockerfile.j2), not
    # here. The service/unit name still differs by family: Debian/Ubuntu: ssh, RedHat/Rocky: sshd.
    ssh_key_rotation_sshd_service: "{{ 'sshd' if ansible_facts['os_family'] == 'RedHat' else 'ssh' }}"
  tasks:
    - name: Prepare | Ensure sshd is running
      ansible.builtin.systemd:
        name: "{{ ssh_key_rotation_sshd_service }}"
        state: started
        enabled: true

    - name: Prepare | Ensure PermitRootLogin allows key auth (test images default to prohibit-password already)
      ansible.builtin.lineinfile:
        path: /etc/ssh/sshd_config
        regexp: '^#?\s*PermitRootLogin'
        line: 'PermitRootLogin prohibit-password'
      notify: Restart sshd for prepare

    - name: Prepare | Install the ephemeral seed public key as pre-existing authorized access
      ansible.posix.authorized_key:
        user: root
        key: "{{ lookup('file', ssh_key_rotation_test_dir + '/' + ssh_key_rotation_test_seed_key + '.pub') }}"
        state: present

    - name: Prepare | Discover this container's IP address on the docker network
      ansible.builtin.command: hostname -I
      changed_when: false
      register: ssh_key_rotation_container_ip

    - name: Prepare | Record this container's IP for the generated inventory
      ansible.builtin.set_fact:
        ssh_key_rotation_container_ip: "{{ ssh_key_rotation_container_ip.stdout.split() | first }}"

    - name: Prepare | Ensure the [rotate] group header is present in the generated inventory
      ansible.builtin.lineinfile:
        path: "{{ ssh_key_rotation_test_dir }}/rotation_inventory.ini"
        line: "[rotate]"
        insertbefore: BOF
        create: true
        mode: "0600"
      delegate_to: localhost
      run_once: true

    - name: Prepare | Append this host to the generated rotation inventory
      ansible.builtin.lineinfile:
        path: "{{ ssh_key_rotation_test_dir }}/rotation_inventory.ini"
        create: true
        mode: "0600"
        line: >-
          {{ inventory_hostname }} ansible_host={{ ssh_key_rotation_container_ip }} ansible_user=root
          ansible_ssh_common_args='-o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null'
        insertafter: EOF
      delegate_to: localhost

  handlers:
    - name: Restart sshd for prepare
      ansible.builtin.systemd:
        name: "{{ ssh_key_rotation_sshd_service }}"
        state: restarted
