---

# Rotates SSH keys safely in three stages: validate locally, install the new key via
# the old one, then prove the new key works before removing the old key and legacy
# auth. See README.md for the full safety model, variables, and examples.
#
# ansible-playbook -i inventory.ini playbooks/rotate.yml \
#   -e "old_private_key=~/.ssh/id_old" \
#   -e "new_private_key=~/.ssh/pwc_id_ed25519" \
#   -e "new_public_key_file=./pwc_id_ed25519.pub" \
#   -e "old_public_key_file=./id_old.pub"

- name: Validate | Validate the local system and variables
  hosts: localhost
  connection: local
  gather_facts: false
  tasks:
    - name: Validate | run the role's validate stage
      ansible.builtin.include_role:
        name: ssh_key_rotation
        tasks_from: validate

- name: Install | Install the new key and prepare sshd (connect via OLD key)
  hosts: rotate
  gather_facts: true
  vars:
    ansible_ssh_private_key_file: "{{ old_private_key }}"
  tasks:
    - name: Install | run the role's install stage
      ansible.builtin.include_role:
        name: ssh_key_rotation
        tasks_from: install

- name: Verify | Verify the new key and remove the old key (connect via NEW key)
  hosts: rotate
  gather_facts: false        # gathered explicitly by the verify stage, AFTER resetting the connection
  vars:
    ansible_ssh_private_key_file: "{{ new_private_key }}"
  tasks:
    - name: Verify | run the role's verify stage
      ansible.builtin.include_role:
        name: ssh_key_rotation
        tasks_from: verify
