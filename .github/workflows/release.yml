---

name: Release to Ansible Galaxy

on:
  push:
    tags:
      - "v*"
  # Lets the build be exercised without cutting a tag; publishing stays gated on the tag.
  workflow_dispatch:

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install Ansible
        run: |
          python -m pip install --upgrade pip
          pip install "ansible>=2.18"

      # A tag of v1.2.3 must match `version: 1.2.3` in galaxy.yml. Galaxy rejects a re-upload of
      # an existing version, so catching the mismatch here avoids a half-finished release.
      - name: Check the tag matches galaxy.yml
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          tag_version="${GITHUB_REF_NAME#v}"
          galaxy_version="$(python -c "import yaml,sys; print(yaml.safe_load(open('galaxy.yml'))['version'])")"
          if [ "$tag_version" != "$galaxy_version" ]; then
            echo "Tag ${GITHUB_REF_NAME} does not match galaxy.yml version ${galaxy_version}" >&2
            exit 1
          fi

      - name: Build the collection artifact
        run: ansible-galaxy collection build --output-path ./dist

      - name: Upload the artifact to the workflow run
        uses: actions/upload-artifact@v5
        with:
          name: collection-tarball
          path: dist/*.tar.gz

      - name: Publish to Ansible Galaxy
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GALAXY_API_KEY: ${{ secrets.GALAXY_API_KEY }}
        run: |
          ansible-galaxy collection publish \
            dist/krameff-ssh_key_rotation-*.tar.gz \
            --api-key "$GALAXY_API_KEY"
