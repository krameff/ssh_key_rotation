# Example inventory for SSH key rotation
# Copy this to inventory.ini and update with your hosts

[rotate]
# Define hosts that should have SSH keys rotated
prod-web-01 ansible_host=10.0.1.10 ansible_user=ubuntu
prod-web-02 ansible_host=10.0.1.11 ansible_user=ubuntu
prod-db-01 ansible_host=10.0.2.10 ansible_user=ec2-user
prod-cache-01 ansible_host=10.0.3.10 ansible_user=ubuntu

[rotate:vars]
# Optional: set common variables for all hosts in the rotate group
# ansible_become=yes
# ansible_become_method=sudo
