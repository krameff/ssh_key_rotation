---

namespace: krameff
name: ssh_key_rotation
# Development placeholder. The released version comes from the git tag: the release workflow
# stamps `v1.2.3` into this field before building, so this value only affects local builds.
version: 0.9.0
readme: README.md
authors:
  - Krameff Solutions Limited <info@krameff.com>
description: Safe SSH key rotation for production systems with multi-phase validation
license:
  - MIT
repository: https://github.com/krameff/ssh_key_rotation
issues: https://github.com/krameff/ssh_key_rotation/issues
documentation: https://github.com/krameff/ssh_key_rotation
tags:
  - security
  - ssh
  - key_management
  - infrastructure
dependencies:
  ansible.posix: ">=1.3.0"
build_ignore:
  - extensions/molecule
  - .github
  - .claude
  - .cursor
  - .ansible
  - .mcp.json
  - inventory.ini
  # Belt and braces: these are gitignored and should never exist in a clean checkout, but a
  # build run from a developer's working tree must not pick up local key material or paths.
  # rotation_vars.example.yml is NOT excluded - the docs tell users to copy it.
  - test_*
  - rotation_vars.yml
